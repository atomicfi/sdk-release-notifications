name: Notify Releases

on:
  workflow_call:
    secrets:
      GITHUB_DEPLOY_KEY:
        description: "GitHub ssh key with access to sdk-release-notifications repository"
        required: true
      SLACK_WEBHOOK_URL:
        description: "Slack Incoming Webhook URL"
        required: true
      NOTION_API_KEY:
        description: "Notion API key for accessing Notion SDK Releases page"
        required: true
      LINEAR_API_KEY:
        description: "Linear API key for creating issues"
        required: true
      GOOGLE_SERVICE_ACCOUNT_FILE:
        description: "Google Drive API service_account.json"
        required: true
      GOOGLE_DRIVE_FOLDER_ID:
        description: "Google Drive folder ID where PDFs will be saved"
        required: true
      GITHUB_RELEASE_PULL_TOKEN:
        description: "GitHub token for accessing release information"
        required: false
    inputs:
      srn_ref:
        description: "The branch, tag, or commit SHA to checkout for the sdk-release-notifications repo"
        required: false
        default: "main"
        type: string

jobs:
  notify:
    name: Notify about new releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: atomicfi/sdk-release-notifications
          ref: ${{ inputs.srn_ref }}
          ssh-key: ${{ secrets.GITHUB_DEPLOY_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Prepare Google Drive API credentials
        run: |
          echo "$SERVICE_ACCOUNT_JSON" > service_account.json
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_FILE }}

      - name: Notify about new releases
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_RELEASE_PULL_TOKEN: ${{ secrets.GITHUB_RELEASE_PULL_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          python -m main

      - name: Clean up Google Drive API credentials
        if: always()
        run: |
          rm service_account.json
